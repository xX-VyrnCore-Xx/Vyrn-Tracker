name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test e build (debug + release)
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION_NAME --stacktrace
      - name: Report dei test (se falliscono)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
      - name: Prepara APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/VyrnTracker-v${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: vyrn-tracker-apk
          path: dist/*.apk
      - name: Pubblica su GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Vyrn Tracker v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: dist/*.apk
